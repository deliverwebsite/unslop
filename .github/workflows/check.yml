name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The CLI supports every maintained Node.js release line.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Data files follow their schemas, every lint check passes its examples, generated files are up to date,
      # the tests pass, and everything is formatted.
      - run: npm run check
